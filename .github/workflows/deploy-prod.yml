name: Deploy Production
on:
  push:
    branches: [ main ]
env:
  NODE_VERSION: '22'
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      #-----------------------------------
      # 1.  Build on the runner
      #-----------------------------------
      - uses: actions/checkout@v4
  
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install deps & type-check
        run: |
          npm ci                # dev deps included
          npm run type-check || echo "no type-check script"
  
      - name: Build (Next.js)
        env:
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ secrets.CONTACT_ENDPOINT_PROD }}
        run: npm run build

      
      #-----------------------------------
      # 2.  Rsync artefacts to EC2
      #-----------------------------------
      - name: Rsync build to EC2
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -azv --delete --exclude 'node_modules' --exclude '.github'
          path: ./
          remote_path: /home/ubuntu/apps/prod
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USER }}
          remote_key: ${{ secrets.EC2_KEY }}


      #-----------------------------------
      # 3.  SSH and do a light refresh
      #-----------------------------------
      - name: Install prod deps & reload
        uses: appleboy/ssh-action@v1
        with:
          host:       ${{ secrets.EC2_HOST }}
          username:   ${{ secrets.EC2_USER }}
          key:        ${{ secrets.EC2_KEY }}
          timeout:            180s     
          command_timeout:     20m
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
  
            cd ~/apps/prod
            echo "[EC2] installing production deps…"
            npm ci --omit=dev --ignore-scripts --loglevel verbose
  
            echo "[EC2] reloading pm2…"
            if pm2 list | grep -q "prod-site"; then
              pm2 reload prod-site --update-env
            else
              pm2 start "npm start" --name prod-site --env PORT=3000
              pm2 save
            fi
  
            echo "[EC2] deploy done at $(date)"
          ssh_options: "-tt"

      - name: Invalidate CloudFront cache
        uses: chetan/invalidate-cloudfront-action@v2
        env:
          DISTRIBUTION: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          PATHS: "/*"
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          